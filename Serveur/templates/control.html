	<style>
		#temperature, #gps {
			display:flex;
		  max-width: 100%x;
		  margin: 2px 0px;

		#displey_mesures ,#actions,#out{
			height: 35vh;

		  align-self:;

		#map {
		      height: 35vh;   /* Set map height */

		    }

			display:flex;

			height: 35vh;
			width: 100%;

			justify-content: space-around;

			display:flex;

		# l0{
			display:flex;

<body>

<div id="l0">
	<h1>Menu de controle<h1>
</div>

<div id="l1">
	<div id="displey_mesures">
		<p id="temperature"></p>
		<p id="gps"></p>
	</div >
	<div id="map"></div>
</div>
<div id="l2">
	<div id="actions">
		<button class ="boutton_mesures" onclick="priseMesure() ">Prise de mesures </button>
		<button class ="boutton_mesures" onclick="arret_bateau() ">Arret bateau </button>	
		<button class ="boutton_mesures" onclick="relance_bateau() ">Relance bateau </button>
	</div>
	<pre id="out"></pre>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
<script>
async function priseMesure(){
        fetch('/mesures');
        }
async function arret_bateau(){
	fetch('/arret');       
	}
async function relance_bateau(){
        fetch('/reprendre');
        }
async function t() {
    const  temperature= document.getElementById("temperature");
    try {
        const response = await fetch('/get_last');
        const data = await response.json();
		temperature.textContent += "Dernière température : " + data.temperature + "\n";

    } catch (err) {
        temperature.textContent += "Erreur récupération données\n";
    }
}



async function g() {
    const  gpsEL= document.getElementById("gps");
    try {
        const response = await fetch('/get_last');
        const data = await response.json();
		const gps = JSON.parse(data.gps);
		gpsEL.textContent += "Dernière position : " + data.gps + "\n";
		
	    var marker = L.marker(gps,{icon: Icon_bateau}).addTo(map);
			//marker.bindPopup(`<b>num=${data.id}</b><br>t=${data.temperature} co=${gps}`).openPopup();
			map.setView(gps, 14);
			



        

    } catch (err) {
        gps.textContent += "Erreur récupération données\n";
    }
}

  window.addEventListener('load', t);
  window.addEventListener('load', g);  
  var Icon_bateau = L.icon({iconUrl: '../static/image/bateau.png',iconSize: [38, 40],iconAnchor: [22, 94],popupAnchor: [-3, -76],});
  var map = L.map('map').setView([46.37, 6.25 ], 10);
      // Add tile layer
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
</script>
